<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PulseMarket — Crypto Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050810;
  --bg2:#090d1a;
  --bg3:#0e1525;
  --bg4:#131c30;
  --border:#1a2540;
  --border2:#243050;
  --text:#e8edf8;
  --text2:#8a9bc0;
  --text3:#4a5a7a;
  --accent:#00e5ff;
  --accent2:#00ff88;
  --accent3:#ff4d6d;
  --accent4:#ffb347;
  --accent5:#bd93f9;
  --glow:0 0 20px rgba(0,229,255,0.15);
  --glow2:0 0 30px rgba(0,229,255,0.25);
  --font-display:'Syne',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-display);
  min-height:100vh;
  overflow-x:hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* TICKER TAPE */
.ticker-wrap{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  overflow:hidden;
  height:36px;
  display:flex;
  align-items:center;
}
.ticker-inner{
  display:flex;
  gap:0;
  animation:ticker 35s linear infinite;
  white-space:nowrap;
}
.ticker-inner:hover{animation-play-state:paused}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{
  font-family:var(--font-mono);
  font-size:11px;
  padding:0 24px;
  display:flex;
  gap:8px;
  align-items:center;
  border-right:1px solid var(--border);
}
.ticker-item span.sym{color:var(--text);font-weight:600}
.ticker-item span.price{color:var(--text2)}
.ticker-item span.up{color:var(--accent2)}
.ticker-item span.dn{color:var(--accent3)}

/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.main-layout{display:grid;grid-template-columns:220px 1fr 280px;gap:0;flex:1;min-height:0}

/* SIDEBAR */
.sidebar{
  background:var(--bg2);
  border-right:1px solid var(--border);
  padding:20px 0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:calc(100vh - 36px);
  overflow-y:auto;
}
.logo{
  padding:0 20px 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
}
.logo-mark{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:800;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--accent),var(--accent5));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo-sub{font-size:10px;color:var(--text3);font-family:var(--font-mono);letter-spacing:2px;margin-top:2px}

.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 20px;
  cursor:pointer;
  transition:all .2s;
  font-size:13px;
  font-weight:500;
  color:var(--text2);
  border-left:2px solid transparent;
  position:relative;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{
  color:var(--accent);
  border-left-color:var(--accent);
  background:rgba(0,229,255,0.05);
}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-badge{
  margin-left:auto;
  background:var(--accent3);
  color:#fff;
  font-size:9px;
  font-family:var(--font-mono);
  padding:2px 6px;
  border-radius:10px;
  font-weight:600;
}
.nav-section{
  font-size:9px;
  letter-spacing:2px;
  color:var(--text3);
  padding:16px 20px 6px;
  font-family:var(--font-mono);
}

/* TOPBAR */
.topbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  position:sticky;
  top:0;
  z-index:100;
  grid-column:2/-1;
}
.search-bar{
  flex:1;
  max-width:400px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:border-color .2s;
}
.search-bar:focus-within{border-color:var(--accent)}
.search-bar input{
  background:none;
  border:none;
  outline:none;
  color:var(--text);
  font-family:var(--font-mono);
  font-size:12px;
  width:100%;
}
.search-bar input::placeholder{color:var(--text3)}
.search-icon{color:var(--text3);font-size:14px}

.topbar-actions{display:flex;align-items:center;gap:12px;margin-left:auto}
.btn-icon{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--text2);
  transition:all .2s;
  position:relative;
}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:6px;height:6px;
  background:var(--accent3);
  border-radius:50%;
}
.pill-filter{
  display:flex;
  gap:6px;
  padding:0 24px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.pill{
  font-size:11px;
  font-family:var(--font-mono);
  padding:8px 14px;
  cursor:pointer;
  color:var(--text3);
  border-bottom:2px solid transparent;
  transition:all .2s;
  white-space:nowrap;
}
.pill:hover{color:var(--text2)}
.pill.active{color:var(--accent);border-bottom-color:var(--accent)}

/* MAIN CONTENT */
.content{
  overflow-y:auto;
  height:calc(100vh - 36px);
}
.feed{padding:20px 24px;display:flex;flex-direction:column;gap:14px}

/* SIGNAL CARDS */
.signal-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  cursor:pointer;
  transition:all .25s;
  animation:slideIn .4s ease both;
  position:relative;
  overflow:hidden;
}
.signal-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  opacity:0;
  transition:opacity .3s;
}
.signal-card:hover{
  border-color:var(--border2);
  transform:translateY(-1px);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.signal-card:hover::before{opacity:1}

.signal-card.SURGE{border-left:3px solid var(--accent2)}
.signal-card.SURGE::before{background:var(--accent2)}
.signal-card.DIP{border-left:3px solid var(--accent4)}
.signal-card.DIP::before{background:var(--accent4)}
.signal-card.BREAKOUT{border-left:3px solid var(--accent)}
.signal-card.BREAKOUT::before{background:var(--accent)}
.signal-card.CRASH_ALERT{border-left:3px solid var(--accent3);animation:slideIn .4s ease both,pulse-red 2s ease infinite}
.signal-card.ATH{border-left:3px solid gold}
.signal-card.ATH::before{background:gold}
.signal-card.RECOVERY{border-left:3px solid var(--accent5)}
.signal-card.RECOVERY::before{background:var(--accent5)}
.signal-card.CONSOLIDATION{border-left:3px solid var(--text3)}

@keyframes slideIn{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse-red{
  0%,100%{box-shadow:none}
  50%{box-shadow:0 0 20px rgba(255,77,109,0.2)}
}

.card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.asset-logo{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--bg3);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  overflow:hidden;
  flex-shrink:0;
}
.asset-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.asset-info{flex:1}
.asset-name{font-size:14px;font-weight:700;color:var(--text)}
.asset-sym{font-family:var
